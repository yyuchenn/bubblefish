[package]
name = "bubblefish-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Rust's release LTO performs the optimization. Keeping Binaryen optional avoids
# another downloaded native tool and makes the build reproducible on stable Rust.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
bubblefish-core = { path = "../core" }
bubblefish-formats = { path = "../formats" }
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
md5 = "0.7.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6.5"

