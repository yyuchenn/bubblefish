[package]
name = "bubblefish-formats"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
bubblefish-core = { path = "../core" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
