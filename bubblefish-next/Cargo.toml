[workspace]
members = ["crates/core", "crates/formats", "crates/wasm", "src-tauri", "tools/typegen"]
default-members = ["crates/core", "crates/formats"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

