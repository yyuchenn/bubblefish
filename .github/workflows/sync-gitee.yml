name: Repair Bubblefish Gitee mirror

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to mirror (for example v0.4.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/update-manifests.yml
    with:
      tag: ${{ inputs.tag }}
      mirror_only: true
    secrets: inherit
