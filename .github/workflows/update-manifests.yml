name: Publish Bubblefish updater manifests

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      staged:
        description: Publish the signed artifacts from this desktop build
        type: boolean
        default: false
      mirror_only:
        description: Repair Gitee from an existing signed GitHub release
        type: boolean
        default: false
    secrets:
      GITEE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to verify and repair (for example v0.4.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Verify, mirror and publish update feeds
    runs-on: ubuntu-latest
    concurrency:
      group: bubblefish-stable-updater
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          dependencies: 'false'
      - name: Download signed Windows artifacts
        if: inputs.staged
        uses: actions/download-artifact@v4
        with:
          name: bubblefish-windows-x64
          path: .cache/updater-staging/windows/
      - name: Download signed macOS artifacts
        if: inputs.staged
        uses: actions/download-artifact@v4
        with:
          name: bubblefish-macos-arm64
          path: .cache/updater-staging/macos/
      - name: Publish verified installers and complete update feeds
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          STAGED: ${{ inputs.staged }}
          MIRROR_ONLY: ${{ inputs.mirror_only }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: yyuchenn/bubblefish
        shell: bash
        run: |
          args=(--tag "$RELEASE_TAG")
          if [[ "$STAGED" == 'true' ]]; then args+=(--artifacts .cache/updater-staging); fi
          if [[ "$MIRROR_ONLY" == 'true' ]]; then args+=(--mirror-only); fi
          node scripts/publish-updater.mjs "${args[@]}"
