name: Build Bubblefish desktop

on:
  push:
    branches: [main, 'preview_*']
    paths-ignore: ['legacy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['legacy/**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: Platforms to build
        default: all
        required: true
        type: choice
        options: [all, windows-only, macos-only]

permissions:
  contents: read

env:
  BUBBLEFISH_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

jobs:
  windows:
    name: Windows x64 installers
    if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'windows-only'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Windows target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Check release identity
        if: github.event_name == 'release'
        run: npm run check:identity
      - name: Test native host
        run: npm run test:host
      - name: Build MSI and NSIS installers
        run: npm run build:desktop -- --target x86_64-pc-windows-msvc --bundles msi,nsis
      - name: Sign installers when a Windows certificate is configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE) {
            Write-Host 'No Windows certificate configured; keeping unsigned manual installers.'
            exit 0
          }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signtool) { throw 'Windows SDK signtool.exe not found' }
          $certificatePath = Join-Path $env:RUNNER_TEMP "bubblefish-$([guid]::NewGuid()).pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $installers = @(
              Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            )
            if ($installers.Count -ne 2) { throw 'Expected one MSI and one NSIS installer' }
            foreach ($installer in $installers) {
              & $signtool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Code signing failed: $($installer.Name)" }
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Sign and verify final updater installers
        if: github.event_name == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release.mjs windows target/x86_64-pc-windows-msvc/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bubblefish-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ARM64 installer
    if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'macos-only'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install macOS ARM64 target
        run: rustup target add aarch64-apple-darwin
      - name: Check release identity
        if: github.event_name == 'release'
        run: npm run check:identity
      - name: Test native host
        run: npm run test:host
      - name: Build app and disk image
        run: npm run build:desktop -- --target aarch64-apple-darwin --bundles app,dmg
      - name: Archive app with executable permissions
        shell: bash
        env:
          COPYFILE_DISABLE: '1'
        run: |
          version=$(node -p "require('./package.json').version")
          tar -czf "target/aarch64-apple-darwin/release/bundle/macos/Bubblefish_${version}_aarch64.app.tar.gz" \
            -C target/aarch64-apple-darwin/release/bundle/macos Bubblefish.app
      - name: Sign and verify final updater archive and disk image
        if: github.event_name == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release.mjs macos target/aarch64-apple-darwin/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bubblefish-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish signed desktop release and update feeds
    if: github.event_name == 'release'
    needs: [windows, macos]
    permissions:
      contents: write
    uses: ./.github/workflows/update-manifests.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      staged: true
    secrets: inherit
