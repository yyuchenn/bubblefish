name: Build Bubblefish plugins

on:
  push:
    branches: [main]
    paths-ignore: ['legacy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['legacy/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUBBLEFISH_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

jobs:
  deepseek:
    name: DeepSeek translation plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - name: Check product identity and plugin types
        run: |
          npm run check:identity
          npm run plugin:deepseek:check
      - name: Build DeepSeek plugin package
        run: npm run plugin:deepseek:build
      - uses: actions/upload-artifact@v7
        with:
          name: bubblefish-plugin-deepseek
          path: dist/plugins/deepseek-translation-plugin.bfplugin
          if-no-files-found: error
          retention-days: 14

  kha_web:
    name: Kha White OCR (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check product identity and plugin types
        run: |
          npm run check:identity
          npm run plugin:kha-white:check
      - name: Build WASM tools and Kha Web plugin package
        run: |
          npm run build:wasm
          npm run plugin:kha-white:build -- --web-only
      - uses: actions/upload-artifact@v7
        with:
          name: bubblefish-plugin-kha-web
          path: dist/plugins/kha-white-ocr-plugin-web.bfplugin
          if-no-files-found: error
          retention-days: 14

  examples:
    name: Plugin checks and example packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check plugin protocol and build tools
        run: |
          npm run check:identity
          npm run test:plugins
          node --test scripts/ort-runtime.test.mjs scripts/wasm-bindgen.test.mjs
      - name: Build example plugin packages
        run: |
          npm run plugin:pack -- examples/plugins/document-toolbox
          npm run plugin:pack -- examples/plugins/history-inspector
          npm run plugin:pack -- examples/plugins/edit-guard
      - uses: actions/upload-artifact@v7
        with:
          name: bubblefish-example-plugins
          path: |
            dist/plugins/example.document-toolbox.bfplugin
            dist/plugins/example.history-inspector.bfplugin
            dist/plugins/example.edit-guard.bfplugin
          if-no-files-found: error
          retention-days: 14

  native:
    name: Kha White OCR (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install native target
        run: rustup target add ${{ matrix.target }}
      - name: Check release identity
        run: |
          npm run check:identity
          npm run plugin:kha-white:check
      - name: Build locked WASM tools
        run: npm run build:wasm
      - name: Fetch official ONNX Runtime CPU package
        run: node plugins/kha-white-ocr/fetch-runtime.mjs --target ${{ matrix.target }}
      - name: Build native plugin package
        run: npm run plugin:kha-white:build -- --target ${{ matrix.target }}
      - name: Check packaged ONNX Runtime loads without models
        run: cargo run --locked --release -p bubblefish-kha-white-ocr --features native --target ${{ matrix.target }} --example runtime-check -- .cache/kha-white-ocr/${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: bubblefish-plugins-${{ matrix.target }}
          path: dist/plugins/kha-white-ocr-plugin-${{ matrix.target }}.bfplugin
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish plugin packages to GitHub and Gitee
    if: ${{ github.event_name == 'release' && !cancelled() }}
    needs: [deepseek, kha_web, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bubblefish-stable-updater
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout publishing tools from this build
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
      - name: Resolve release source commit
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release.mjs --tag "$RELEASE_TAG" --resolve-only
      - name: Verify plugin build source is still the release tag
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
        shell: bash
        run: |
          if [[ "$BUILD_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo 'Release tag moved after the plugin build; refusing to publish different source.' >&2
            exit 1
          fi
      - name: Checkout pinned release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.release_commit }}
          path: .cache/release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Download available official plugin packages
        uses: actions/download-artifact@v8
        with:
          pattern: bubblefish-plugin*
          path: plugin-artifacts/
      - name: Publish verified plugin packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: yyuchenn/bubblefish
        run: node scripts/publish-plugins.mjs --tag "$RELEASE_TAG" --source .cache/release-source --artifacts plugin-artifacts
