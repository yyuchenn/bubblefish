name: Build Bubblefish plugins

on:
  push:
    branches: [main]
    paths-ignore: ['legacy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['legacy/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUBBLEFISH_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

jobs:
  web:
    name: Web and example plugin packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check product identity and plugin types
        run: |
          npm run check:identity
          npm run plugin:deepseek:check
          npm run plugin:kha-white:check
          npm run test:plugins
          node --test scripts/ort-runtime.test.mjs scripts/wasm-bindgen.test.mjs
      - name: Build WASM tools and plugin packages
        run: |
          npm run build:wasm
          npm run plugin:deepseek:build
          npm run plugin:pack -- examples/plugins/document-toolbox
          npm run plugin:pack -- examples/plugins/history-inspector
          npm run plugin:pack -- examples/plugins/edit-guard
          npm run plugin:kha-white:build -- --web-only
      - uses: actions/upload-artifact@v7
        with:
          name: bubblefish-web-plugins
          path: dist/plugins/*.bfplugin
          if-no-files-found: error
          retention-days: 14

  native:
    name: Kha White OCR (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install native target
        run: rustup target add ${{ matrix.target }}
      - name: Check release identity
        run: npm run check:identity
      - name: Build locked WASM tools
        run: npm run build:wasm
      - name: Fetch official ONNX Runtime CPU package
        run: node plugins/kha-white-ocr/fetch-runtime.mjs --target ${{ matrix.target }}
      - name: Build native plugin package
        run: npm run plugin:kha-white:build -- --target ${{ matrix.target }}
      - name: Check packaged ONNX Runtime loads without models
        run: cargo run --locked --release -p bubblefish-kha-white-ocr --features native --target ${{ matrix.target }} --example runtime-check -- .cache/kha-white-ocr/${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: bubblefish-plugins-${{ matrix.target }}
          path: dist/plugins/kha-white-ocr-plugin-${{ matrix.target }}.bfplugin
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish plugin packages to GitHub and Gitee
    if: github.event_name == 'release'
    needs: [web, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bubblefish-stable-updater
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          dependencies: 'false'
      - uses: actions/download-artifact@v8
        with:
          name: bubblefish-web-plugins
          path: plugin-artifacts/web/
      - uses: actions/download-artifact@v8
        with:
          name: bubblefish-plugins-x86_64-pc-windows-msvc
          path: plugin-artifacts/windows/
      - uses: actions/download-artifact@v8
        with:
          name: bubblefish-plugins-aarch64-apple-darwin
          path: plugin-artifacts/macos/
      - name: Publish verified plugin packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: yyuchenn/bubblefish
        run: node scripts/publish-plugins.mjs --tag "$RELEASE_TAG" --artifacts plugin-artifacts
