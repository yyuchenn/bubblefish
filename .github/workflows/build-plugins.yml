name: Build Bubblefish plugins

on:
  push:
    branches: [main]
    paths-ignore: ['legacy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['legacy/**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUBBLEFISH_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

jobs:
  web:
    name: Web and example plugin packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check product identity and plugin types
        run: |
          npm run check:identity
          npm run plugin:deepseek:check
          npm run plugin:kha-white:check
          npm run test:plugins
      - name: Build WASM tools and plugin packages
        run: |
          npm run build:wasm
          npm run plugin:deepseek:build
          npm run plugin:pack -- examples/plugins/document-toolbox
          npm run plugin:pack -- examples/plugins/history-inspector
          npm run plugin:pack -- examples/plugins/edit-guard
          npm run plugin:kha-white:build -- --web-only
      - uses: actions/upload-artifact@v4
        with:
          name: bubblefish-web-plugins
          path: dist/plugins/*.bfplugin
          if-no-files-found: error
          retention-days: 14

  native:
    name: Kha White OCR (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runtime: onnxruntime-win-x64-1.22.0.zip
          - os: macos-15
            target: aarch64-apple-darwin
            runtime: onnxruntime-osx-arm64-1.22.0.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install native target
        run: rustup target add ${{ matrix.target }}
      - name: Check release identity
        run: npm run check:identity
      - name: Build locked WASM tools
        run: npm run build:wasm
      - name: Fetch official ONNX Runtime 1.22.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORT_ARCHIVE: ${{ matrix.runtime }}
        run: |
          New-Item -ItemType Directory -Force -Path .cache/ort | Out-Null
          $archive = Join-Path $PWD ".cache/ort/$env:ORT_ARCHIVE"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/$env:ORT_ARCHIVE" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath .cache/ort -Force
          $runtime = Join-Path $PWD '.cache/ort/onnxruntime-win-x64-1.22.0/lib/onnxruntime.dll'
          if (!(Test-Path $runtime)) { throw 'ONNX Runtime library not found' }
          "BUBBLEFISH_ORT_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fetch official ONNX Runtime 1.22.0 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ORT_ARCHIVE: ${{ matrix.runtime }}
        run: |
          mkdir -p .cache/ort
          curl --fail --location --retry 3 "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/$ORT_ARCHIVE" -o ".cache/ort/$ORT_ARCHIVE"
          tar -xzf ".cache/ort/$ORT_ARCHIVE" -C .cache/ort
          runtime="$PWD/.cache/ort/onnxruntime-osx-arm64-1.22.0/lib/libonnxruntime.1.22.0.dylib"
          test -f "$runtime"
          echo "BUBBLEFISH_ORT_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Build native plugin package
        run: npm run plugin:kha-white:build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bubblefish-plugins-${{ matrix.target }}
          path: dist/plugins/kha-white-ocr-plugin-${{ matrix.target }}.bfplugin
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach plugin packages to release
    if: github.event_name == 'release'
    needs: [web, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bubblefish-*-plugins
          path: plugin-artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: bubblefish-plugins-*
          path: plugin-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: plugin-artifacts/**/*.bfplugin
          fail_on_unmatched_files: true
