name: Verify and deploy Bubblefish web

on:
  push:
    branches: [main, 'preview_*']
    paths-ignore: ['legacy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['legacy/**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        default: preview
        required: true
        type: choice
        options: [preview, production]

permissions:
  contents: read

env:
  BUBBLEFISH_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

jobs:
  verify:
    name: Verify core, plugins and browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install test browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Verify application
        run: npm run verify
      - name: Check WASM and production plugin types
        run: |
          npm run check:wasm
          npm run plugin:deepseek:check
          npm run plugin:kha-white:check
      - name: Add hosting headers
        run: cp deploy/cloudflare/_headers dist/web/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: bubblefish-web
          path: dist/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bubblefish-browser-failures
          path: |
            .cache/playwright-report/
            .cache/playwright-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy verified web artifact
    needs: verify
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          dependencies: 'false'
      - uses: actions/download-artifact@v4
        with:
          name: bubblefish-web
          path: dist/web/
      - name: Select deployment branch
        id: destination
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const production = process.env.DEPLOY_EVENT === 'release' || process.env.DEPLOY_ENVIRONMENT === 'production';
          const branch = production ? 'main' : process.env.DEPLOY_REF === 'main' ? 'preview' : process.env.DEPLOY_REF.replace(/[^A-Za-z0-9._-]/g, '-');
          if (!branch) throw new Error('Empty deployment branch');
          appendFileSync(process.env.GITHUB_OUTPUT, `branch=${branch}\n`);
          NODE
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=bubblefish --branch=${{ steps.destination.outputs.branch }} --commit-dirty=true
